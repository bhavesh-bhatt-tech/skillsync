sonar.projectKey=skillsync
sonar.projectName=SkillSync
sonar.sourceEncoding=UTF-8

sonar.sources=src,server,prisma
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,.storybook/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml
