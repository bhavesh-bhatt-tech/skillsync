services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: interview_hub
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: ${DATABASE_PASS:-interview}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_PASS: ${DATABASE_PASS:-interview}
      DATABASE_URL: postgresql://interview:${DATABASE_PASS:-interview}@postgres:5432/interview_hub?schema=public
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
        VITE_ADMIN_KEY: ${VITE_ADMIN_KEY:?Set VITE_ADMIN_KEY before building the frontend}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:

